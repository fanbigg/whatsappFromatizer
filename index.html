<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Event Roster Formatter</title>
  <meta name="description" content="Turn raw WhatsApp event booking blocks into clean rosters. Runs entirely in your browser.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">

  <style>
    /* ============================================================
       Shared macOS app shell.

       This block is identical across the Micro Apps set (QR Generator,
       Event Formatter, Wheel of Fortune). Change it in one app and copy
       it to the others rather than editing a single app in isolation.
       ============================================================ */
    :root {
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

      /* Light Mode Palette */
      --window-bg: #ececec;
      --content-bg: #ffffff;
      --input-bg: #ffffff;
      --input-border: #c3c3c3;
      --text-main: #333333;
      --text-muted: #888888;
      --accent-blue: #007af5;
      --accent-hover: #0062c4;
      --accent-text: #ffffff;
      --control-bg: #ffffff;
      --control-hover: #f2f2f2;
      --success: #1a9d3a;
      --danger: #d70015;
      --border-color: #dcdcdc;
      --shadow-color: rgba(0, 0, 0, 0.15);
      --placeholder-color: #bbbbbb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark Mode Palette */
        --window-bg: #2d2d2d;
        --content-bg: #1e1e1e;
        --input-bg: #2d2d2d;
        --input-border: #4a4a4a;
        --text-main: #dfdfdf;
        --text-muted: #8e8e8e;
        --accent-blue: #0a84ff;
        --accent-hover: #0066d6;
        --accent-text: #ffffff;
        --control-bg: #3a3a3a;
        --control-hover: #454545;
        --success: #30d158;
        --danger: #ff453a;
        --border-color: #383838;
        --shadow-color: rgba(0, 0, 0, 0.4);
        --placeholder-color: #555555;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background-color: var(--content-bg);
      color: var(--text-main);
      font-family: var(--font-stack);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      padding-top: max(1.5rem, env(safe-area-inset-top, 0px));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing: antialiased;
    }

    /* macOS Window Simulator */
    .macos-window {
      background-color: var(--window-bg);
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 20px 40px var(--shadow-color), 0 0 0 1px rgba(0,0,0,0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* macOS Title Bar */
    .title-bar {
      height: 38px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      position: relative;
      border-bottom: 1px solid var(--border-color);
      user-select: none;
      flex: none;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-close { background-color: #ff5f56; border: 0.5px solid #e0443e; }
    .dot-minimize { background-color: #ffbd2e; border: 0.5px solid #dfa123; }
    .dot-zoom { background-color: #27c93f; border: 0.5px solid #1aab29; }

    .window-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
    }

    /* Window Content Pane */
    .content-pane {
      background-color: var(--content-bg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }

    label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.45;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    textarea:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.35);
    }

    textarea::placeholder { color: var(--placeholder-color); }

    textarea:disabled { opacity: 0.55; }

    .hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* macOS Push Button */
    .btn {
      height: 32px;
      padding: 0 14px;
      background-color: var(--accent-blue);
      color: var(--accent-text);
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background-color 0.15s ease;
      touch-action: manipulation;
      flex: none;
    }

    .btn-block { width: 100%; }

    .btn:hover:not(:disabled) { background-color: var(--accent-hover); }
    .btn:active:not(:disabled) { opacity: 0.85; }

    .btn:focus-visible {
      outline: 2px solid var(--accent-hover);
      outline-offset: 2px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Secondary / bezeled button */
    .btn-secondary {
      background-color: var(--control-bg);
      color: var(--text-main);
      border: 1px solid var(--input-border);
    }

    .btn-secondary:hover:not(:disabled) { background-color: var(--control-hover); }

    .btn-danger { background-color: var(--danger); color: #ffffff; }
    .btn-danger:hover:not(:disabled) { background-color: var(--danger); opacity: 0.88; }

    /* Inline status line — used instead of alert() so errors never block. */
    .status {
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      min-height: 1.4em;
      color: var(--text-muted);
    }

    .status.error { color: var(--danger); font-weight: 500; }

    /* ---- Phone ---- */
    @media (max-width: 520px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      .macos-window {
        max-width: none;
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }

      .title-bar {
        height: calc(46px + env(safe-area-inset-top, 0px));
        padding-top: env(safe-area-inset-top, 0px);
      }

      /* Set-dressing on desktop; only a mis-tap target on a phone. */
      .traffic-lights { display: none; }

      .window-title {
        position: static;
        transform: none;
        font-size: 17px;
      }

      .content-pane {
        flex: 1;
        padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
        gap: 18px;
      }

      textarea {
        /* 16px stops iOS Safari zooming the page on focus. */
        font-size: 16px;
        padding: 12px;
        border-radius: 10px;
      }

      .btn {
        height: 46px;
        font-size: 16px;
        border-radius: 10px;
      }

      .hint, .status { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    /* ==================== end shared shell ==================== */

    /* ==================== Event Formatter ==================== */
    .macos-window {
      max-width: 1100px;
      height: calc(100dvh - 3rem);
    }

    /* Two panes split the window, divided by a hairline like a macOS split view. */
    .split {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background-color: var(--border-color);
      overflow: hidden;
    }

    .pane {
      background-color: var(--content-bg);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 10px;
      min-height: 0;
      min-width: 0;
    }

    .pane-header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 32px;
    }

    .pane-header label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pane-actions {
      display: flex;
      gap: 8px;
      flex: none;
    }

    .pane textarea {
      flex: 1;
      min-height: 0;
      font-family: var(--font-mono);
      line-height: 1.5;
      padding: 12px;
      resize: none;
    }

    .btn[hidden] { display: none; }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(20px);
      background-color: var(--success);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      max-width: calc(100vw - 32px);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 8px 24px var(--shadow-color);
      z-index: 50;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background-color: var(--danger); }

    /* Two mono panes side by side stop being readable well before the
       shared 520px phone breakpoint, so the split stacks earlier. */
    @media (max-width: 820px) {
      .macos-window { height: auto; min-height: calc(100dvh - 3rem); }

      .split {
        display: flex;
        flex-direction: column;
        gap: 0;
        background-color: transparent;
        overflow: visible;
      }

      .pane + .pane { border-top: 1px solid var(--border-color); }

      .pane textarea {
        flex: none;
        height: 34dvh;
        min-height: 200px;
      }
    }

    @media (max-width: 520px) {
      .macos-window { min-height: 100dvh; }
      .pane { padding: 16px; }
      .pane textarea { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div class="macos-window">

    <div class="title-bar">
      <div class="traffic-lights">
        <span class="dot dot-close"></span>
        <span class="dot dot-minimize"></span>
        <span class="dot dot-zoom"></span>
      </div>
      <span class="window-title">Event Formatter</span>
    </div>

    <div class="split">
      <!-- Input Pane -->
      <div class="pane">
        <div class="pane-header">
          <label for="inputText">INPUT &#183; RAW WHATSAPP BLOCK</label>
          <div class="pane-actions">
            <button type="button" class="btn btn-secondary" id="btn-clear">Clear</button>
          </div>
        </div>
        <textarea id="inputText" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste blocks here...

Nama: Ms Lim
No phone: 016-2282102
Tarikh: 08/08/2026
Tempat: Kuantan Parade
Type of event: Conference
Masa Event: 9.00AM - 3.00PM
Session Hour: 6 Hours"></textarea>
      </div>

      <!-- Output Pane -->
      <div class="pane">
        <div class="pane-header">
          <label for="outputText">OUTPUT &#183; FORMATTED ROSTER</label>
          <div class="pane-actions">
            <button type="button" class="btn btn-secondary" id="btn-share" hidden>Share</button>
            <button type="button" class="btn" id="btn-copy">Copy</button>
          </div>
        </div>
        <textarea id="outputText" readonly placeholder="Formatted output will appear here automatically..."></textarea>
      </div>
    </div>

  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    const RATE_PER_HOUR = 15;   // RM per hour
    const PREP_HOURS = 1;       // unpaid-prep call time added before the session

    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    const inputEl = document.getElementById('inputText');
    const outputEl = document.getElementById('outputText');
    const toastEl = document.getElementById('toast');
    const btnCopy = document.getElementById('btn-copy');
    const btnShare = document.getElementById('btn-share');
    const btnClear = document.getElementById('btn-clear');

    /* ---------------- parsing ---------------- */

    // Accepts 9, 9AM, 9 am, 9.00, 9:00, 9.00AM, 9.00 a.m. — minutes and the
    // am/pm marker are both optional, because WhatsApp bookings never agree.
    function parseTime(timeStr) {
      if (!timeStr) return null;
      const s = timeStr.toUpperCase().replace(/[\s.]*([AP])\.?M\.?\s*$/, '$1M').replace(/\s+/g, '');
      const match = s.match(/^(\d{1,2})(?:[.:h](\d{2}))?(AM|PM)?$/);
      if (!match) return null;

      let hours = parseInt(match[1], 10);
      const minutes = match[2] ? parseInt(match[2], 10) : 0;
      const period = match[3];

      if (hours > 23 || minutes > 59) return null;
      if (period && hours > 12) return null;

      if (period === 'PM' && hours < 12) hours += 12;
      if (period === 'AM' && hours === 12) hours = 0;

      return { hours, minutes, hasPeriod: Boolean(period) };
    }

    function toMinutes(t) {
      return t.hours * 60 + t.minutes;
    }

    // Splits "9.00AM - 3.00PM" on hyphen, en/em dash, or the word "to".
    function splitRange(str) {
      const parts = str.split(/\s*(?:-|–|—|~|\bto\b|\bhingga\b|\bsehingga\b)\s*/i).filter(p => p.trim());
      return parts.length === 2 ? parts : null;
    }

    // "9 - 3PM" only makes sense if the 9 is AM. When the start time carries no
    // marker, pick the reading that yields a sane forward-running session.
    function resolveRange(startRaw, endRaw) {
      const start = parseTime(startRaw);
      const end = parseTime(endRaw);
      if (!start || !end) return null;

      if (!start.hasPeriod && start.hours < 12) {
        const asAm = toMinutes(start);
        const asPm = toMinutes({ hours: start.hours + 12, minutes: start.minutes });
        const endMins = toMinutes(end);
        if (endMins - asAm <= 0 && endMins - asPm > 0) start.hours += 12;
      }

      let duration = toMinutes(end) - toMinutes(start);
      if (duration <= 0) duration += 24 * 60;   // event runs past midnight

      return { start, end, duration };
    }

    function formatTime12(hours, minutes) {
      const period = hours >= 12 ? 'pm' : 'am';
      const h12 = hours % 12 === 0 ? 12 : hours % 12;
      return h12 + '.' + String(minutes).padStart(2, '0') + period;
    }

    function parseDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.trim().split(/[\/.\-\s]+/);
      if (parts.length < 3) return null;

      const d = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      let y = parseInt(parts[2], 10);
      if (!Number.isFinite(d) || !Number.isFinite(m) || !Number.isFinite(y)) return null;
      if (y < 100) y += 2000;

      const dateObj = new Date(y, m - 1, d);
      // new Date(2026, 1, 31) silently rolls over to 03 March. Reject that
      // instead of emitting a date the client never booked.
      if (dateObj.getFullYear() !== y || dateObj.getMonth() !== m - 1 || dateObj.getDate() !== d) {
        return null;
      }

      return String(d).padStart(2, '0') + '/' + String(m).padStart(2, '0') + '/' + y +
        ' (' + DAYS[dateObj.getDay()] + ')';
    }

    // Trims a trailing ".0" so 6 hours reads "6 Hours" and 5.5 reads "5.5 Hours".
    function trimNumber(n) {
      return String(Math.round(n * 100) / 100);
    }

    function formatHours(n) {
      return trimNumber(n) + (n === 1 ? ' Hour' : ' Hours');
    }

    /* ---------------- formatting ---------------- */

    function formatBlock(block) {
      const data = {};
      block.split('\n').forEach(line => {
        const colonIdx = line.indexOf(':');
        if (colonIdx !== -1) {
          data[line.slice(0, colonIdx).trim().toLowerCase()] = line.slice(colonIdx + 1).trim();
        }
      });

      if (!data['tarikh'] && !data['tempat']) return '';

      const rawDate = data['tarikh'] || '';
      const formattedDate = parseDate(rawDate) || rawDate;
      const tempat = data['tempat'] || '';
      const typeOfEvent = data['type of event'] || '';

      let masaEventFormatted = data['masa event'] || '';
      let callTimeFormatted = '';
      let sessionHoursStr = data['session hour'] || '';
      let totalHours = 0;

      const range = data['masa event'] ? splitRange(data['masa event']) : null;
      const resolved = range ? resolveRange(range[0], range[1]) : null;

      if (resolved) {
        const { start, end, duration } = resolved;
        masaEventFormatted = formatTime12(start.hours, start.minutes) + ' - ' +
                             formatTime12(end.hours, end.minutes);

        // Call time = PREP_HOURS before the session starts.
        const callMins = ((toMinutes(start) - PREP_HOURS * 60) % 1440 + 1440) % 1440;
        callTimeFormatted = '*' + formatTime12(Math.floor(callMins / 60), callMins % 60) + '*';

        // Round to the nearest half hour so a 5h30m session is not billed as 6h.
        const sessionHours = Math.round(duration / 30) / 2;
        sessionHoursStr = formatHours(sessionHours);
        totalHours = sessionHours + PREP_HOURS;
      }

      const totalPay = totalHours * RATE_PER_HOUR;

      return [
        'Tarikh: ' + formattedDate,
        'Tempat: ' + tempat,
        'Type of event: ' + typeOfEvent,
        'Call Time: ' + callTimeFormatted,
        'Masa Event: ' + masaEventFormatted,
        'Session Hour: ' + sessionHoursStr,
        'Rate: RM ' + RATE_PER_HOUR + '/h',
        'Total Hours: ' + formatHours(totalHours),
        'Total Pay: RM ' + trimNumber(totalPay),
        'Roster:'
      ].join('\n');
    }

    function processInput() {
      const formatted = inputEl.value
        .split(/\n\s*\n/)
        .map(formatBlock)
        .filter(Boolean)
        .join('\n-----------------------------------------\n');

      outputEl.value = formatted;
      const empty = formatted.length === 0;
      btnCopy.disabled = empty;
      btnShare.disabled = empty;
    }

    /* ---------------- actions ---------------- */

    let toastTimer = null;
    function showToast(message, isError) {
      toastEl.textContent = message;
      toastEl.classList.toggle('error', Boolean(isError));
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    // navigator.clipboard needs a secure context; opening index.html straight
    // off the filesystem is not one, so keep the execCommand path around.
    function legacyCopy(text) {
      const scratch = document.createElement('textarea');
      scratch.value = text;
      scratch.setAttribute('readonly', '');
      scratch.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
      document.body.appendChild(scratch);
      scratch.select();
      scratch.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } finally { scratch.remove(); }
      return ok;
    }

    async function copyOutput() {
      const text = outputEl.value;
      if (!text) { showToast('Nothing to copy yet', true); return; }

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else if (!legacyCopy(text)) {
          throw new Error('execCommand copy rejected');
        }
        showToast('Copied to clipboard!');
      } catch (err) {
        if (legacyCopy(text)) {
          showToast('Copied to clipboard!');
        } else {
          showToast('Copy blocked — select the text manually', true);
        }
      }
    }

    async function shareOutput() {
      const text = outputEl.value;
      if (!text) { showToast('Nothing to share yet', true); return; }
      try {
        await navigator.share({ text });
      } catch (err) {
        if (err && err.name === 'AbortError') return;   // user dismissed the sheet
        showToast('Sharing not available', true);
      }
    }

    function clearInput() {
      inputEl.value = '';
      processInput();
      inputEl.focus();
    }

    inputEl.addEventListener('input', processInput);
    btnCopy.addEventListener('click', copyOutput);
    btnClear.addEventListener('click', clearInput);

    if (navigator.share) {
      btnShare.hidden = false;
      btnShare.addEventListener('click', shareOutput);
    }

    processInput();
  </script>
</body>
</html>
